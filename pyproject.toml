[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-lines"
version = "0.1.0"
description = "Check invoice line items for arithmetic mistakes"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
invoice-lines = "invoice_lines.cli:main"

[tool.setuptools]
packages = ["invoice_lines"]
